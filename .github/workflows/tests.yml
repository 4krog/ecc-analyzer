name: ECC Analyzer tests

on:
  push:
    branches:
      - main
      - feature/proof-of-impact-certificates
      - refactor/reusable-ecc-core
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile ecc-analyzer.py certificate_generator.py
          python -m compileall -q ecc_analyzer tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v
